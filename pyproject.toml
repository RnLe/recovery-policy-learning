[project]
name = "grounded-recovery"
version = "0.1.0"
description = "Budget-matched corrective imitation learning for recovery in language-conditioned embodied policies in BabyAI/MiniGrid."
requires-python = "==3.11.*"
dependencies = [
    "torch==2.13.0",
    "minigrid==3.1.0",
    "gymnasium==1.3.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "Pillow>=10.0",
    "imageio>=2.34",
]

[project.scripts]
gr = "grounded_recovery.cli:main"
grf = "gr_foundations.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_recovery", "src/gr_foundations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: full-scale runs (complete preflight, pilot training); excluded from the fast suite",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
